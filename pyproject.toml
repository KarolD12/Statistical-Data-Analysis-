[project]
name = "eda-llm"
version = "0.1.0"
description = "Análisis exploratorio de CSV con estadísticas, detección de atípicos y faltantes, e informe redactado por un LLM (Groq u Ollama)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.19",
    "streamlit>=1.40",
    "groq>=0.11",
    "python-dotenv>=1.0",
    "markdown>=3.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["eda"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
